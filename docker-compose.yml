services:
  postgres:
    image: postgres:17
    container_name: supply-chain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supply_chain
      POSTGRES_USER: supply_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5434:5432"
    volumes:
      - supply_chain_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply_user -d supply_chain"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  supply_chain_data: